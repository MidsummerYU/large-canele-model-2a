[project]
name = "booklet-nli"
version = "0.1.0"
description = "Multilingual natural language inference over Swiss official voting booklets"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fonttools>=4.50",
    "markdown>=3.6",
    "matplotlib>=3.9",
    "openai>=1.50",
    "py3langid>=0.3",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pypdf>=5.0",
    "pyyaml>=6.0",
]

[project.scripts]
booklet-nli = "booklet_nli.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/booklet_nli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
